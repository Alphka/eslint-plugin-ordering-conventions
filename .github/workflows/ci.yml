name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linting does not vary with the Node version, so it runs once rather than once per matrix
  # entry. It runs on the floor of `engines` because that is the claim worth testing: the dev
  # toolchain (cspell) requires 22.18, and a dependency that raises that floor has to fail here.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18"
          cache: npm

      - run: npm ci

      - run: npm run lint

      # The published .d.ts files are generated from the JSDoc, so a source change that was not
      # followed by `npm run build:types` would ship stale types.
      - name: types are up to date
        run: |
          npm run build:types
          git diff --exit-code -- types

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["22.18", "24", "26"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

  eslint9:
    name: eslint 9
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18"
          cache: npm

      - run: npm ci

      # peerDependencies allows ESLint 9, so the rules have to pass there too. Only the suite runs:
      # linting this repo itself goes through @eslint/js 10, which is not what the peer promises.
      - run: npm install --no-save eslint@^9

      - run: npm test
